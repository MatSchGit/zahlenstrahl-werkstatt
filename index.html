<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zahlenstrahl-Werkstatt</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17324d;background:#eef6fc}*{box-sizing:border-box}body{margin:0}header{background:#145b91;color:white;padding:20px}main{max-width:1050px;margin:auto;padding:16px}.panel{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #1232}h1{margin:0;font-size:1.8rem}h2{margin-top:0}button,input,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #9ab3c6}button{cursor:pointer;background:#1769aa;color:white;border:0;margin:4px}button.secondary{background:#dcecf7;color:#124b75}label{display:inline-flex;flex-direction:column;gap:5px;margin:6px}input{width:135px}select{min-width:120px}.hidden{display:none}.controls{display:flex;flex-wrap:wrap;align-items:end}svg{width:100%;height:auto;touch-action:manipulation;user-select:none}.display{overflow-x:auto}#feedback{font-weight:bold;min-height:28px}.muted{color:#526a7a}nav button.active{background:#ffcd4d;color:#163a57}#flagAnswers{display:flex;gap:12px;flex-wrap:wrap;font-size:1.3rem;font-weight:700}.big{font-size:1.2rem}body.projector main{max-width:1500px}body.projector svg{min-width:650px}
</style></head><body><header><h1>🐳 Zahlenstrahl-Werkstatt</h1><p>Mathematik · Klasse 4 · Zahlenraum bis 10.000</p></header><main>
<nav><button class="active" data-mode="teacher">Lehrermodus</button><button data-mode="flags">🚩 Fähnchen-Generator</button><button data-mode="child">Kindermodus</button></nav>
<section class="panel" id="settings"><h2>Zahlenstrahl einstellen</h2><div class="controls"><label>Von<input type="number" id="from" value="600" min="0" max="9999"></label><label>Bis<input type="number" id="to" value="700" min="1" max="10000"></label><label>Schrittweite<select id="step"><option>1</option><option selected>10</option><option>20</option><option>25</option><option>50</option><option>100</option><option>500</option><option>1000</option></select></label><label>Fähnchen<select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label></div><button id="apply">Anwenden</button><button id="generate">Neue Aufgabe</button><button id="solutions" class="secondary">Lösungen anzeigen</button><button id="project" class="secondary">Beameransicht</button><p id="status" class="muted">Einstellungen ändern und auf Anwenden tippen.</p></section>
<section class="panel"><div id="instruction" class="big"></div><div class="display"><svg id="line" viewBox="0 0 1000 230" role="img" aria-label="Interaktiver Zahlenstrahl"></svg></div><div id="flagAnswers"></div><p id="feedback"></p><div id="childControls" class="hidden"><label>Deine Antwort<input id="answer" inputmode="numeric" type="number"></label><button id="check">Prüfen</button><button id="next">Nächste Aufgabe</button></div></section>
<p class="muted">Tipp: Im Lehrermodus kann man durch Tippen auf den Zahlenstrahl eine zusätzliche Markierung setzen. Im Kindermodus die Zahl am Fähnchen ablesen.</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
let mode='teacher',start=600,end=700,step=10,flags=[],show=false,childTarget=650,mark=null;
const fmt=n=>Math.round(n).toLocaleString('de-DE');
function el(tag,attrs={},text=''){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function setMode(m){mode=m;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('childControls').classList.toggle('hidden',m!=='child');$('generate').textContent=m==='child'?'Neue Aufgabe':'Neue Fähnchen';show=false;mark=null;generate()}
function valid(){const a=Number($('from').value),b=Number($('to').value),s=Number($('step').value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b>10000||b<=a){$('status').textContent='Bitte gültige Grenzen von 0 bis 10.000 eingeben (Ende größer als Anfang).';return false}if((b-a)/s>1500){$('status').textContent='Bitte eine größere Schrittweite wählen.';return false}start=a;end=b;step=s;$('status').textContent='Angewendet: '+fmt(start)+' bis '+fmt(end)+' · '+step+'er-Schritte';return true}
function candidates(){const result=[];for(let n=Math.ceil(start/step)*step;n<=end;n+=step)if(n>start&&n<end)result.push(n);return result}
function generate(){const arr=candidates();const cnt=Math.min(Number($('count').value),arr.length);flags=[];while(flags.length<cnt){const n=arr[Math.floor(Math.random()*arr.length)];if(!flags.includes(n))flags.push(n)}flags.sort((a,b)=>a-b);childTarget=flags[0]??Math.round((start+end)/2);show=false;mark=null;$('feedback').textContent='';$('answer').value='';$('solutions').textContent='Lösungen anzeigen';render()}
function render(){const svg=$('line');svg.replaceChildren();const x=n=>75+(n-start)/(end-start)*850;svg.append(el('line',{x1:75,y1:120,x2:935,y2:120,stroke:'#17324d','stroke-width':4}));svg.append(el('path',{d:'M935 120 l-16 -8 v16 z',fill:'#17324d'}));
const span=end-start;const tickCount=Math.floor(span/step);let every=Math.max(1,Math.ceil(tickCount/110));for(let i=0;i<=tickCount;i+=every){const n=start+i*step;if(n>end)break;const xx=x(n);svg.append(el('line',{x1:xx,y1:111,x2:xx,y2:129,stroke:'#355c7d','stroke-width':1.5}))}
let labelStep=step;while(span/labelStep>12)labelStep+=step;for(let n=start;n<=end;n+=labelStep){const xx=x(n);svg.append(el('line',{x1:xx,y1:105,x2:xx,y2:135,stroke:'#17324d','stroke-width':2.5}));svg.append(el('text',{x:xx,y:161,'text-anchor':'middle','font-size':22,fill:'#17324d'},fmt(n)))}if((end-start)%labelStep!==0){svg.append(el('text',{x:x(end),y:191,'text-anchor':'middle','font-size':22,fill:'#17324d'},fmt(end)))}
const active=mode==='child'?[childTarget]:mode==='flags'?flags:mark!==null?[mark]:[];
active.forEach((n,i)=>{const xx=x(n);svg.append(el('line',{x1:xx,y1:52,x2:xx,y2:119,stroke:'#d97706','stroke-width':3}));svg.append(el('path',{d:'M'+xx+' 52 l42 0 -9 16 -33 0 z',fill:'#f59e0b'}));svg.append(el('text',{x:xx+18,y:65,'text-anchor':'middle','font-size':16,'font-weight':'bold',fill:'#422006'},mode==='flags'?String.fromCharCode(65+i):'?'))});
$('instruction').textContent=mode==='flags'?'Bei welchen Zahlen stehen die Fähnchen?':mode==='child'?'Welche Zahl ist markiert?': 'Zahlenstrahl: '+fmt(start)+' bis '+fmt(end);
$('flagAnswers').replaceChildren();if(show){active.forEach((n,i)=>{const p=document.createElement('span');p.textContent=(mode==='flags'?String.fromCharCode(65+i)+': ':'')+fmt(n);$('flagAnswers').append(p)})}
}
$('line').addEventListener('click',e=>{if(mode!=='teacher')return;const r=$('line').getBoundingClientRect();const svgX=(e.clientX-r.left)*1000/r.width;const raw=start+(svgX-75)/850*(end-start);mark=Math.max(start,Math.min(end,Math.round(raw/step)*step));show=false;render()});
$('apply').addEventListener('click',()=>{if(valid())generate()});$('generate').addEventListener('click',generate);$('solutions').addEventListener('click',()=>{show=!show;$('solutions').textContent=show?'Lösungen verbergen':'Lösungen anzeigen';render()});$('project').addEventListener('click',()=>document.body.classList.toggle('projector'));
$('check').addEventListener('click',()=>{const a=$('answer').value;if(a===''){$('feedback').textContent='Bitte zuerst eine Zahl eingeben.';return}$('feedback').textContent=Number(a)===childTarget?'Richtig! 🎉':'Noch nicht ganz. Achte auf die Abstände.'});
$('next').addEventListener('click',generate);document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));generate();
})();
</script></body></html>
